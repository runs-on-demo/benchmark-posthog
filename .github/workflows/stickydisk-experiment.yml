name: Experiment / PostHog Cache Comparison

on:
  workflow_dispatch:

concurrency:
  group: experiment-posthog-cache-comparison
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cold:
    name: Cold / ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: github-gha-cache
            cache_id: github-gha
            runner: ubuntu-24.04
            runs_on: false
            sticky: false
            registry: false
          - backend: runs-on-magic-cache
            cache_id: runs-on-magic
            runner: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/family=m8a.xlarge/extras=s3-cache/volume=60gb:gp3:400mibps/env=demo/spot=false
            runs_on: true
            sticky: false
            registry: false
          - backend: runs-on-ecr-cache
            cache_id: unused
            runner: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/family=m8a.xlarge/extras=ecr-cache/volume=60gb:gp3:400mibps/env=demo/spot=false
            runs_on: true
            sticky: false
            registry: true
          - backend: runs-on-sticky-lazy-init
            cache_id: unused
            runner: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/family=m8a.xlarge/sticky=posthog-lazy-${{ github.run_id }}-${{ github.run_attempt }}:60gb:gp3:400mibps:lazy-init/env=demo/spot=false
            runs_on: true
            sticky: true
            registry: false
          - backend: runs-on-sticky-200mibps-init
            cache_id: unused
            runner: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/family=m8a.xlarge/sticky=posthog-init-${{ github.run_id }}-${{ github.run_attempt }}:60gb:gp3:400mibps:200mibps-init/env=demo/spot=false
            runs_on: true
            sticky: true
            registry: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Configure RunsOn and sticky BuildKit cache
        if: ${{ matrix.runs_on }}
        id: runs-on
        uses: runs-on/action@v2
        with:
          sticky_cache: |
            ${{ matrix.sticky && 'buildkit' || '' }}
          show_costs: summary
          metrics: cpu,memory,disk

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Reclaim GitHub runner disk space
        if: ${{ !matrix.runs_on }}
        run: sudo rm -rf /opt

      - name: Set up ephemeral Buildx
        if: ${{ !matrix.sticky }}
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.34.1
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.31.1
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              reservedSpace = "30%"
              maxUsedSpace = "60%"
              minFreeSpace = "20GB"
              max-parallelism = 1

      - name: Set up persistent Buildx
        if: ${{ matrix.sticky }}
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ steps.runs-on.outputs.buildkit-builder }}
          version: v0.34.1
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.31.1
          cleanup: false
          buildkitd-config-inline: |
            ${{ steps.runs-on.outputs.buildkit-inline-config }}
            [worker.oci]
              gc = true
              reservedSpace = "30%"
              maxUsedSpace = "60%"
              minFreeSpace = "20GB"
              max-parallelism = 1

      - name: Build PostHog with GHA cache
        if: ${{ !matrix.sticky && !matrix.registry }}
        uses: docker/build-push-action@v7
        with:
          context: ./upstream
          cache-from: type=gha,scope=posthog-${{ matrix.cache_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-to: type=gha,scope=posthog-${{ matrix.cache_id }}-${{ github.run_id }}-${{ github.run_attempt }},mode=max,compression=zstd,compression-level=1,force-compression=true
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1

      - name: Build PostHog with ECR cache
        if: ${{ matrix.registry }}
        uses: docker/build-push-action@v7
        env:
          TAG: ${{ env.RUNS_ON_ECR_CACHE }}:posthog-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          context: ./upstream
          push: true
          tags: ${{ env.TAG }}
          cache-from: type=registry,ref=${{ env.TAG }}
          cache-to: type=registry,ref=${{ env.TAG }},mode=max,compression=zstd,compression-level=1,force-compression=true
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1

      - name: Build PostHog with sticky cache
        if: ${{ matrix.sticky }}
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.runs-on.outputs.buildkit-builder }}
          context: ./upstream
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1

      - name: Record final cache state
        if: ${{ always() }}
        run: |
          docker system df || true
          df -h / "${RUNS_ON_STICKYDISK_DIR:-/}" || true

  wait-after-cold:
    name: Wait for cold snapshots
    needs: cold
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - run: sleep 120

