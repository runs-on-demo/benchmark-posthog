name: Benchmark
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '14 0 * * *'

permissions:
  contents: read

jobs:
  build-with-github:
    name: GitHub / ${{ matrix.image }} / ${{ matrix.caching }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu-24.04-4
          - ubuntu-24.04-arm
        caching:
          - cache=enabled
          - cache=disabled
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Determine upstream commit SHA
        id: upstream
        run: echo "sha=$(cd upstream && git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Reclaim some disk space
        run: sudo rm -rf /opt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v4
        if: ${{ matrix.caching == 'cache=enabled' }}
        with:
          context: https://github.com/PostHog/posthog.git#${{ steps.upstream.outputs.sha }}
          # One scope per architecture: the x64 and arm64 jobs run concurrently
          # and would otherwise overwrite each other's cache.
          cache-from: type=gha,scope=posthog-${{ runner.arch }}
          cache-to: type=gha,scope=posthog-${{ runner.arch }},mode=max
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
      - uses: docker/build-push-action@v4
        if: ${{ matrix.caching == 'cache=disabled' }}
        with:
          context: https://github.com/PostHog/posthog.git#${{ steps.upstream.outputs.sha }}
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1

  build-with-runs-on:
    name: RunsOn / ${{ matrix.runner }} / ${{ matrix.caching }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - image=ubuntu24-full-x64,family=m8azn.3xlarge
          - image=ubuntu24-full-arm64,family=r8g.2xlarge
        caching:
          - cache=enabled
          - cache=disabled
          - cache=sticky
        include:
          # BuildKit state lives on an EBS sticky disk restored from the
          # previous run's snapshot (per architecture): no cache import/export.
          # Throughput and IOPS match the root volume defaults.
          - caching: cache=sticky
            sticky: ",sticky=posthog-buildkit:80gb:gp3:400mibps:3000iops"
    runs-on: runs-on=${{ github.run_id }},${{ matrix.runner }},extras=ecr-cache,volume=120gb,env=demo,tag=${{ matrix.caching }}${{ matrix.sticky }}
    steps:
      - uses: runs-on/action@v2
        id: runs-on
        with:
          show_costs: 'summary'
          metrics: cpu,memory,disk
          sticky_cache: ${{ matrix.caching == 'cache=sticky' && 'buildkit' || '' }}
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Determine upstream commit SHA
        id: upstream
        run: echo "sha=$(cd upstream && git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
        if: ${{ matrix.caching != 'cache=sticky' }}
      - uses: docker/setup-buildx-action@v3
        if: ${{ matrix.caching == 'cache=sticky' }}
        with:
          name: ${{ steps.runs-on.outputs.buildkit-builder }}
          driver: docker-container
          cleanup: false
      - uses: docker/build-push-action@v4
        if: ${{ matrix.caching == 'cache=enabled' }}
        env:
          # One cache ref per architecture: the x64 and arm64 jobs run
          # concurrently and would otherwise overwrite each other's cache.
          CACHE_REF: "${{ env.RUNS_ON_ECR_CACHE }}:posthog-cache-${{ runner.arch }}"
        with:
          context: https://github.com/PostHog/posthog.git#${{ steps.upstream.outputs.sha }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=max
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
      - uses: docker/build-push-action@v4
        if: ${{ matrix.caching == 'cache=disabled' }}
        with:
          context: https://github.com/PostHog/posthog.git#${{ steps.upstream.outputs.sha }}
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
      - uses: docker/build-push-action@v4
        if: ${{ matrix.caching == 'cache=sticky' }}
        with:
          builder: ${{ steps.runs-on.outputs.buildkit-builder }}
          context: https://github.com/PostHog/posthog.git#${{ steps.upstream.outputs.sha }}
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1

